name: Mobile Flutter

on:
  push:
    branches:
      - master
      - codex/flutter-mobile-app
    paths:
      - "college_erp_mobile/**"
      - ".github/workflows/mobile.yml"
  pull_request:
    paths:
      - "college_erp_mobile/**"
      - ".github/workflows/mobile.yml"

jobs:
  verify-mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: college_erp_mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Format check
        run: dart format --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Debug Android build
        run: flutter build apk --debug
